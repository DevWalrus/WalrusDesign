name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: node_modules/.bin/playwright install --with-deps chromium

      - run: npm test
